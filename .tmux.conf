set -g default-shell /bin/zsh
set -g default-command zsh

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind-key C-a last-window

set -g base-index 1
setw -g pane-base-index 1

set -s escape-time 0
setw -g aggressive-resize on

setw -g monitor-activity on
set -g visual-activity on

setw -g automatic-rename on

set -g default-terminal "screen-256color"

setw -g mode-keys vi
if-shell 'tmux list-keys -T copy-mode-vi >/dev/null 2>&1' \
  "bind-key -T copy-mode-vi v send -X begin-selection; bind-key -T copy-mode-vi y send -X copy-selection-and-cancel" \
  "bind-key -t vi-copy 'v' begin-selection; bind-key -t vi-copy 'y' copy-selection"

bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

set -g status-interval 1
set -g status-justify centre
set -g status-left-length 20
set -g status-right-length 140

set -g status-style bg=colour235,fg=colour136
setw -g window-status-style fg=colour244,bg=default
setw -g window-status-current-style fg=colour166,bg=default

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240

set -g message-style bg=colour235,fg=colour166

set -g display-panes-active-colour colour33
set -g display-panes-colour colour166
setw -g clock-mode-colour green

set -g status-left '#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname -r | cut -c 1-6)#[default]'
set -g status-right '#[fg=green,bright]#(command -v tmux-mem-cpu-load >/dev/null 2>&1 && tmux-mem-cpu-load 1) #[fg=white]%a %l:%M:%S %p #[fg=blue]%Y-%m-%d#[default]'
